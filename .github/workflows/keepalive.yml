# Hält das Supabase-Projekt im Free-Tarif aktiv.
# Free-Projekte werden nach etwa einer Woche ohne Aktivität pausiert (Risiko: Winter- und Sommerpause).
# Dieser Workflow ruft alle drei Tage die Funktion public.keepalive() auf. Sie führt eine echte
# Datenbankabfrage aus, liefert aber keine Daten (nur die Serverzeit).
# Schlägt der Aufruf fehl (zum Beispiel weil das Projekt pausiert ist), schlägt der Lauf fehl und GitHub
# schickt eine Fehlermail. Das ist der Alarm.
#
# URL und Publishable Key sind öffentlich (siehe initSupabase() in index.html). Ändert sich einer davon,
# hier nachziehen.
# GitHub deaktiviert geplante Workflows, wenn das Repository 60 Tage ohne Aktivität bleibt.
# Dann unter Actions den Workflow wieder aktivieren oder einen Commit machen.
name: Keep-alive Supabase

on:
  schedule:
    - cron: '23 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: https://hlhvipsfpamicwilmusw.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_58jhuq4EIWrYT-lpQ_Hrxw_e5sqNaUE
    steps:
      - name: keepalive aufrufen
        run: |
          code=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          cat response.json; echo
          test "$code" = "200"
