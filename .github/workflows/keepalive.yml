# Hält das Supabase-Projekt im Free-Tarif aktiv.
# Free-Projekte werden pausiert, wenn sie über eine Woche zu wenig Datenbankaktivität haben.
# Laut Supabase reichen "typischerweise ein paar Anfragen pro Tag". Alle drei Tage ein SELECT now()
# reichte NICHT (Pausierungs-Warnung am 20.11.2026). Deshalb: dreimal täglich, und keepalive()
# schreibt einen Zeitstempel in public.keepalive_heartbeat (echte Schreibaktivität, keine Nutzdaten).
# Schlägt der Aufruf fehl (zum Beispiel weil das Projekt pausiert ist), schlägt der Lauf fehl und GitHub
# schickt eine Fehlermail. Das ist der Alarm.
#
# URL und Publishable Key sind öffentlich (siehe initSupabase() in index.html). Ändert sich einer davon,
# hier nachziehen.
# GitHub deaktiviert geplante Workflows, wenn das Repository 60 Tage ohne Aktivität bleibt.
# Dann unter Actions den Workflow wieder aktivieren oder einen Commit machen.
name: Keep-alive Supabase

on:
  schedule:
    - cron: '23 5,13,21 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: https://hlhvipsfpamicwilmusw.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_58jhuq4EIWrYT-lpQ_Hrxw_e5sqNaUE
    steps:
      - name: keepalive aufrufen
        run: |
          code=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          cat response.json; echo
          test "$code" = "200"
